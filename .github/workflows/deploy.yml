name: Deploy EIS Admin

on:
  push:
    branches:
      - Dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            export PATH="/root/.nvm/versions/node/v24.15.0/bin:$PATH"

            if [ "${{ github.ref_name }}" = "Dev" ]; then
              cd /home/ubuntu/eis/Dev/EIS-frontent-admin
              git checkout -- package.json package-lock.json
              git pull origin Dev
              npm install
              npm run build
              pm2 restart eis-Dev-admin
            elif [ "${{ github.ref_name }}" = "main" ]; then
              cd /home/ubuntu/eis/prod/EIS-frontent-admin
              git checkout -- package.json package-lock.json
              git pull origin main
              npm install
              npm run build
              pm2 restart eis-prod-admin
            fi